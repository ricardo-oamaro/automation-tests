name: API and E2E Tests

on:
  push:
    branches: ["dev", "uat"]

jobs:
  test:
    name: Testes no ambiente ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, uat]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Chrome (para E2E)
        if: matrix.env == 'uat'
        uses: browser-actions/setup-chrome@v1

      - name: Setup Node.js (para JSON Server)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install JSON Server
        run: npm install -g json-server

      - name: Start JSON Server
        run: |
          cp db-${{ matrix.env }}.json db.json
          nohup json-server --watch db.json --port 3000 > json-server.log 2>&1 &
          sleep 5

      - name: Run all tests
        run: mvn clean test
        env:
          BASE_URL: http://localhost:3000

      - name: Generate Allure Report
        run: |
          mkdir -p target/allure-report
          npx allure-commandline generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v3
        with:
          name: allure-report-${{ matrix.env }}
          path: target/allure-report

  deploy:
    name: Deploy para main
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/uat'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Merge para main (simulado)
        run: echo "Todos os testes passaram em UAT. Pronto para deploy para 'main' 🚀"
